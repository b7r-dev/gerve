# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: gerve

builds:
  - id: gerve
    main: ./cmd/gerve
    binary: gerve
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version=v{{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: gerve
    ids:
      - gerve
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - src: web/static/qrcode.LICENSE.txt
        dst: QRCODE-LICENSE.txt

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  sort: asc
  format: "{{ .Message }}"
  groups:
    - title: Features
      regexp: '^feat(\(.+\))?!?:'
      order: 0
    - title: Bug fixes
      regexp: '^fix(\(.+\))?!?:'
      order: 1
    - title: Other changes
      order: 999
  filters:
    exclude:
      - '^docs(\(.+\))?:'
      - '^chore(\(.+\))?:'
      - '^test(\(.+\))?:'
      - '^style(\(.+\))?:'
      - '^design(\(.+\))?:'
      - '^ci(\(.+\))?:'
      - '^Merge '

release:
  name_template: "{{ .Tag }}"
  prerelease: auto
